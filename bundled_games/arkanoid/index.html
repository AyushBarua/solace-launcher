<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Solace Breakout</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #0e0f0b; overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; cursor: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: transparent; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
"use strict";
(function () {
  // ── Logical play field ─────────────────────────────────────────────────────
  const W = 900, H = 640;
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  // ── Theme (Solace dark gold) ────────────────────────────────────────────────
  const COL = {
    bg1: "#14150f", bg2: "#0c0d09",
    gold: "#f2ca50", goldL: "#ffe088", goldD: "#d4af37",
    green: "#27c93f", text: "#e5e2db", muted: "#99907c",
    paddle: "#f2ca50", ball: "#ffe9b0",
    brick: ["#d4732f", "#d99a2b", "#c9a227", "#7ba428", "#2f9e6b", "#3f7fb0"]
  };

  // ── Difficulty (injected by Solace) ─────────────────────────────────────────
  function cfg() { return (window.__solaceGameConfig) || {}; }
  function diffMult() {
    let m = parseFloat(cfg().difficulty_multiplier);
    if (!isFinite(m) || m <= 0) m = 1.0;
    return Math.max(0.4, Math.min(2.2, m));
  }

  // ── High-DPI resize + letterbox scaling ─────────────────────────────────────
  let scale = 1, offX = 0, offY = 0, dpr = 1;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    const cw = window.innerWidth, ch = window.innerHeight;
    canvas.style.width = cw + "px";
    canvas.style.height = ch + "px";
    canvas.width = Math.floor(cw * dpr);
    canvas.height = Math.floor(ch * dpr);
    scale = Math.min(cw / W, ch / H);
    offX = (cw - W * scale) / 2;
    offY = (ch - H * scale) / 2;
  }
  window.addEventListener("resize", resize);
  resize();

  // ── Audio (subtle blips) ────────────────────────────────────────────────────
  let actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "square"; o.frequency.value = freq;
      g.gain.value = vol || 0.05;
      o.connect(g); g.connect(actx.destination);
      const t = actx.currentTime;
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.06));
      o.start(t); o.stop(t + (dur || 0.06) + 0.02);
    } catch (e) {}
  }

  // ── Input ────────────────────────────────────────────────────────────────────
  let axisX = 0;          // analog pron/sup, [-1, 1] (already flipped by Solace)
  let keyDir = 0;         // -1 / 0 / +1 from keyboard
  const keys = {};
  window.addEventListener("solace-axes", function (e) {
    if (e && e.detail && typeof e.detail.x === "number") axisX = e.detail.x;
  });
  window.addEventListener("keydown", function (e) {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keys.left = true; }
    else if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; }
    if (k === " " || k === "Enter" || k === "ArrowUp") { onAction(); }
    keyDir = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
  });
  window.addEventListener("keyup", function (e) {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
    keyDir = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
  });
  window.addEventListener("pointerdown", onAction);

  // ── Game state ────────────────────────────────────────────────────────────────
  const STATE = { READY: 0, PLAY: 1, CLEAR: 2, OVER: 3 };
  let state, score, lives, level, paddle, ball, bricks, flashT;

  const PADDLE_H = 16;
  function paddleWidth() {
    // Easier difficulty → wider paddle. base 150, mult 1 → ~140.
    return Math.max(90, Math.min(220, 170 - 30 * (diffMult() - 0.6)));
  }
  function ballSpeed() {
    return 300 * (0.62 + 0.36 * diffMult()) * (1 + (level - 1) * 0.06);
  }

  function makeBricks() {
    const rows = Math.min(6, 3 + Math.floor((level - 1) / 1) + (diffMult() > 1.3 ? 1 : 0));
    const cols = 11;
    const top = 90, padTop = 8, gap = 6;
    const bw = (W - 60 - gap * (cols - 1)) / cols;
    const bh = 26;
    const arr = [];
    for (let r = 0; r < rows; r++) {
      for (let cI = 0; cI < cols; cI++) {
        arr.push({
          x: 30 + cI * (bw + gap),
          y: top + padTop + r * (bh + gap),
          w: bw, h: bh, alive: true,
          color: COL.brick[r % COL.brick.length],
          pts: (rows - r) * 10
        });
      }
    }
    return arr;
  }

  function resetBallToPaddle() {
    ball = {
      x: paddle.x + paddle.w / 2,
      y: H - 40 - PADDLE_H - 10,
      r: 9, vx: 0, vy: 0, stuck: true
    };
  }

  function newGame() {
    score = 0; lives = 3; level = 1; flashT = 0;
    paddle = { x: W / 2 - paddleWidth() / 2, y: H - 40, w: paddleWidth(), h: PADDLE_H };
    bricks = makeBricks();
    resetBallToPaddle();
    state = STATE.READY;
  }

  function nextLevel() {
    level++;
    paddle.w = paddleWidth();
    paddle.x = W / 2 - paddle.w / 2;
    bricks = makeBricks();
    resetBallToPaddle();
    state = STATE.READY;
  }

  function launchBall() {
    const spd = ballSpeed();
    const ang = (-60 + Math.random() * 40 - 20) * Math.PI / 180; // upward, slight random
    ball.stuck = false;
    ball.vx = spd * Math.sin(ang);
    ball.vy = -Math.abs(spd * Math.cos(ang));
    beep(660, 0.08, "square", 0.05);
  }

  function onAction() {
    if (actx && actx.state === "suspended") actx.resume();
    if (state === STATE.READY) launchBall();
    else if (state === STATE.OVER) newGame();
    else if (state === STATE.CLEAR) nextLevel();
    else if (state === STATE.PLAY && ball.stuck) launchBall();
  }

  // ── Update ────────────────────────────────────────────────────────────────────
  function update(dt) {
    if (flashT > 0) flashT -= dt;

    // Paddle: analog (proportional) + keyboard, real-time, no threshold
    let inX = axisX;
    if (Math.abs(inX) < 0.06) inX = 0;          // tiny dead-zone vs sensor noise
    const dir = Math.max(-1, Math.min(1, inX + keyDir));
    const PSPEED = 900;
    paddle.x += dir * PSPEED * dt;
    if (paddle.x < 20) paddle.x = 20;
    if (paddle.x + paddle.w > W - 20) paddle.x = W - 20 - paddle.w;

    if (state !== STATE.PLAY && state !== STATE.READY) return;

    if (ball.stuck) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - 10 - ball.r;
      return;
    }

    // Integrate with small substeps to avoid tunnelling at high speed
    const steps = Math.max(1, Math.ceil((Math.hypot(ball.vx, ball.vy) * dt) / 8));
    const sdt = dt / steps;
    for (let s = 0; s < steps; s++) {
      ball.x += ball.vx * sdt;
      ball.y += ball.vy * sdt;

      // Walls
      if (ball.x - ball.r < 12) { ball.x = 12 + ball.r; ball.vx = Math.abs(ball.vx); beep(420, 0.04, "sine", 0.04); }
      if (ball.x + ball.r > W - 12) { ball.x = W - 12 - ball.r; ball.vx = -Math.abs(ball.vx); beep(420, 0.04, "sine", 0.04); }
      if (ball.y - ball.r < 60) { ball.y = 60 + ball.r; ball.vy = Math.abs(ball.vy); beep(420, 0.04, "sine", 0.04); }

      // Paddle
      if (ball.vy > 0 &&
          ball.y + ball.r >= paddle.y &&
          ball.y + ball.r <= paddle.y + paddle.h + 12 &&
          ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
        const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
        const spd = Math.hypot(ball.vx, ball.vy);
        const ang = hit * (60 * Math.PI / 180);
        ball.vx = spd * Math.sin(ang);
        ball.vy = -Math.abs(spd * Math.cos(ang));
        ball.y = paddle.y - ball.r - 1;
        beep(540, 0.06, "square", 0.05);
      }

      // Bricks
      for (let i = 0; i < bricks.length; i++) {
        const b = bricks[i];
        if (!b.alive) continue;
        if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
            ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
          // Decide reflection axis by smallest overlap
          const ox = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
          const oy = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
          if (ox < oy) ball.vx = -ball.vx; else ball.vy = -ball.vy;
          b.alive = false;
          score += b.pts;
          flashT = 0.08;
          beep(720 + Math.random() * 120, 0.05, "square", 0.05);
          break;
        }
      }

      // Ball lost
      if (ball.y - ball.r > H) {
        lives--;
        beep(180, 0.25, "sawtooth", 0.06);
        if (lives <= 0) { state = STATE.OVER; return; }
        resetBallToPaddle();
        state = STATE.READY;
        return;
      }
    }

    // Level cleared?
    if (bricks.every(function (b) { return !b.alive; })) {
      state = STATE.CLEAR;
      beep(880, 0.18, "triangle", 0.06);
    }
  }

  // ── Render ────────────────────────────────────────────────────────────────────
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // letterbox background
    ctx.fillStyle = "#0a0b07";
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    ctx.translate(offX, offY);
    ctx.scale(scale, scale);

    // Field background
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, COL.bg1); g.addColorStop(1, COL.bg2);
    ctx.fillStyle = g;
    rr(8, 56, W - 16, H - 64, 16); ctx.fill();
    ctx.strokeStyle = "rgba(242,202,80,0.10)"; ctx.lineWidth = 2;
    rr(8, 56, W - 16, H - 64, 16); ctx.stroke();

    // HUD
    ctx.fillStyle = COL.text;
    ctx.font = "700 22px 'Segoe UI', sans-serif";
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    ctx.fillText("SCORE  " + score, 24, 30);
    ctx.textAlign = "center";
    ctx.fillStyle = COL.gold;
    ctx.fillText("LEVEL " + level, W / 2, 30);
    // Lives as hearts
    ctx.textAlign = "right";
    ctx.fillStyle = COL.green;
    ctx.fillText("♥ ".repeat(Math.max(0, lives)).trim() || "–", W - 24, 30);

    // Bricks
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      if (!b.alive) continue;
      ctx.fillStyle = b.color;
      rr(b.x, b.y, b.w, b.h, 6); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.10)";
      rr(b.x, b.y, b.w, b.h * 0.42, 6); ctx.fill();
    }

    // Paddle
    const pg = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    pg.addColorStop(0, COL.goldL); pg.addColorStop(1, COL.goldD);
    ctx.fillStyle = pg;
    rr(paddle.x, paddle.y, paddle.w, paddle.h, 8); ctx.fill();

    // Ball
    ctx.beginPath();
    ctx.fillStyle = flashT > 0 ? "#ffffff" : COL.ball;
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth = 1.5; ctx.stroke();

    // Overlays
    ctx.textAlign = "center";
    if (state === STATE.READY) {
      banner("Squeeze to launch", "Tilt your wrist to move the paddle");
    } else if (state === STATE.CLEAR) {
      banner("Level " + level + " clear!", "Squeeze to continue");
    } else if (state === STATE.OVER) {
      banner("Game over", "Score " + score + "  ·  Squeeze to play again");
    }

    // Footer hint
    ctx.fillStyle = COL.muted;
    ctx.font = "500 13px 'Segoe UI', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Squeeze = launch   ·   tilt wrist = move   ·   Esc = quit", W / 2, H - 14);
  }

  function banner(title, sub) {
    ctx.save();
    ctx.fillStyle = "rgba(10,11,7,0.72)";
    rr(W / 2 - 260, H / 2 - 70, 520, 140, 20); ctx.fill();
    ctx.strokeStyle = "rgba(242,202,80,0.25)"; ctx.lineWidth = 1.5;
    rr(W / 2 - 260, H / 2 - 70, 520, 140, 20); ctx.stroke();
    ctx.fillStyle = COL.gold;
    ctx.font = "800 40px 'Segoe UI', sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 12);
    ctx.fillStyle = COL.text;
    ctx.font = "500 18px 'Segoe UI', sans-serif";
    ctx.fillText(sub, W / 2, H / 2 + 34);
    ctx.restore();
  }

  // ── Main loop ─────────────────────────────────────────────────────────────────
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05; // clamp after tab stalls
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
