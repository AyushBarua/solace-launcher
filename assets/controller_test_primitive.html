<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent; overflow: hidden; }
    canvas { display: block; }
    #readout {
      position: absolute; bottom: 8px; left: 0; right: 0;
      text-align: center; font-family: monospace; font-size: 12px;
      color: rgba(255,255,255,0.6); pointer-events: none; letter-spacing: 1px;
    }
    #status {
      position: absolute; top: 8px; left: 0; right: 0;
      text-align: center; font-family: monospace; font-size: 11px;
      color: rgba(100,255,100,0.8); pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="status">PIPELINE TEST — Three.js primitive (no GLB)</div>
  <div id="readout">Roll +0.0°   Pitch +0.0°</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script>
    // ── Renderer ──────────────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(renderer.domElement);

    // ── Scene & Camera ────────────────────────────────────────────────────────
    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 200);
    camera.position.set(0, 0, 5);
    camera.lookAt(0, 0, 0);

    // ── Lighting ──────────────────────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const key = new THREE.DirectionalLight(0xfff4d6, 1.4);
    key.position.set(3, 5, 4);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xb0c8ff, 0.5);
    fill.position.set(-4, 1, -2);
    scene.add(fill);

    // ── Primitives (stand-in for controller parts) ────────────────────────────
    // Outer ring  = B frame (pronation/supination)
    const ringGeo  = new THREE.TorusGeometry(1.0, 0.12, 16, 64);
    const ringMat  = new THREE.MeshStandardMaterial({ color: 0x4488ff, metalness: 0.6, roughness: 0.3 });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);

    // Inner rod = handle (flexion/extension)
    const rodGeo   = new THREE.CylinderGeometry(0.08, 0.08, 1.6, 16);
    const rodMat   = new THREE.MeshStandardMaterial({ color: 0xff8844, metalness: 0.4, roughness: 0.5 });
    const rodMesh  = new THREE.Mesh(rodGeo, rodMat);
    rodMesh.rotation.x = Math.PI / 2;   // point rod along Z (depth)

    // Small piston tip
    const tipGeo   = new THREE.SphereGeometry(0.14, 16, 16);
    const tipMat   = new THREE.MeshStandardMaterial({ color: 0xffcc00, metalness: 0.5, roughness: 0.4 });
    const tipMesh  = new THREE.Mesh(tipGeo, tipMat);
    tipMesh.position.z = 0.8;

    // Base disc
    const baseGeo  = new THREE.CylinderGeometry(0.3, 0.35, 0.12, 32);
    const baseMat  = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.3, roughness: 0.7 });
    const baseMesh = new THREE.Mesh(baseGeo, baseMat);
    baseMesh.position.y = -1.2;

    // ── Kinematic groups (mirrors the real controller hierarchy) ───────────────
    // flexExtGroup: handle + piston tip (rotation.x = pitch)
    const flexExtGroup = new THREE.Group();
    flexExtGroup.add(rodMesh);
    flexExtGroup.add(tipMesh);

    // proSupGroup: ring + flexExtGroup (rotation.z = roll)
    const proSupGroup = new THREE.Group();
    proSupGroup.add(ringMesh);
    proSupGroup.add(flexExtGroup);

    // pivot: everything + ambient tilt
    const pivot = new THREE.Group();
    pivot.add(proSupGroup);
    pivot.add(baseMesh);   // base is static
    pivot.rotation.x = THREE.MathUtils.degToRad(5);
    pivot.rotation.y = THREE.MathUtils.degToRad(20);
    scene.add(pivot);

    // ── State ─────────────────────────────────────────────────────────────────
    let _roll  = 0;
    let _pitch = 0;

    // ── Public API (same interface as the real view) ──────────────────────────
    window.setRotation = function(rollDeg, pitchDeg) {
      _roll  = THREE.MathUtils.degToRad(rollDeg);
      _pitch = THREE.MathUtils.degToRad(pitchDeg);
      const s = v => v >= 0 ? '+' : '';
      document.getElementById('readout').innerHTML =
        'Roll '  + s(rollDeg)  + rollDeg.toFixed(1)  + '°&nbsp;&nbsp;&nbsp;' +
        'Pitch ' + s(pitchDeg) + pitchDeg.toFixed(1) + '°';
    };

    // ── Render loop ───────────────────────────────────────────────────────────
    (function animate() {
      requestAnimationFrame(animate);
      proSupGroup.rotation.z  = _roll;    // pronation / supination
      flexExtGroup.rotation.x = _pitch;   // flexion / extension
      renderer.render(scene, camera);
    })();

    // ── Resize ────────────────────────────────────────────────────────────────
    window.addEventListener('resize', function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
