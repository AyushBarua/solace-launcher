<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent; overflow: hidden; }
    canvas { display: block; }
    #readout {
      position: fixed; bottom: 4px; left: 50%; transform: translateX(-50%);
      font-family: monospace; font-size: 13px; color: #ddd;
      background: rgba(0,0,0,0.45); padding: 2px 8px; border-radius: 6px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="readout">Flex/Ext +0.0°&nbsp;&nbsp;Pron/Sup +0.0°</div>

  <script src="three.min.js"></script>
  <script src="GLTFLoader.js"></script>
  <script>
    // ── Renderer ──────────────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    // ── Scene & Camera ────────────────────────────────────────────────────────
    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 200);
    // View from the patient's side (+X = forearm axis / ring opening),
    // near eye level and slightly off-axis. The ambient view angle lives in
    // the CAMERA — model axes stay world-aligned so motion is unambiguous.
    camera.position.set(3.7, 1.0, 0.8);
    camera.lookAt(0, -0.25, 0);

    // ── Lighting: hemisphere base + strong warm key, cool fill, hard rim ─────
    // Directional contrast is what stops white plastic looking flat.
    scene.add(new THREE.HemisphereLight(0xcfd8e8, 0x3a3630, 0.55));

    const key = new THREE.DirectionalLight(0xfff0dd, 1.7);   // warm key, high right
    key.position.set(5, 7, 4);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0x9fb4d8, 0.35); // cool low fill, left
    fill.position.set(1, -1, -5);
    scene.add(fill);

    const rim = new THREE.DirectionalLight(0xffffff, 0.9);   // rim from behind-left
    rim.position.set(-6, 4, -2);
    scene.add(rim);

    renderer.toneMappingExposure = 0.95;

    // ── State ─────────────────────────────────────────────────────────────────
    // NEW rigid device (2026-07 vertical-grip design on base):
    //   flexion/extension    = whole device SPINS about its vertical grip axis
    //   pronation/supination = whole device LEANS sideways (steering-wheel roll)
    // Kinematics (mirrors the real device):
    //   E base disc          -> STATIC, stays on the table
    //   spinGroup (in root)  -> flexion/extension: D support arm, bearings and
    //                           everything above spins about the vertical axis
    //   leanGroup (in spin)  -> pronation/supination: ring + handle assembly
    //                           rolls about the horizontal side-bearing axis,
    //                           pivoted at the ring centre
    let leanGroup = null;
    let spinGroup = null;
    let _flex    = 0;
    let _pronSup = 0;

    // Visual direction signs — flip if on-screen motion mirrors the real device
    const FLEX_VIS_SIGN    = 1;
    const PRONSUP_VIS_SIGN = 1;
    // If the model shows its BACK to the camera, set this to 180
    const MODEL_YAW = 180;
    // Ring centre in raw model coords (from geometry analysis) = lean pivot
    const RING_CENTRE_Y = -87.8;

    // ── Load GLB ─────────────────────────────────────────────────────────────
    const loader = new THREE.GLTFLoader();
    loader.load('Controller5_7.glb?v=' + Date.now(),
      function(gltf) {
        const root = gltf.scene;

        // ── PASS 1: hide the stray 'Cube' primitive ───────────────────────────
        // Must run before any type-filter loop — Cube is an Object3D (not Mesh
        // or Group), so isMesh checks would skip it and leave it visible.
        root.traverse(function(node) {
          if (node.name.toLowerCase() === 'cube') {
            node.visible = false;
          }
        });

        // ── Flip upright first, then centre on the corrected orientation ────────
        root.rotation.x = Math.PI;   // model exports base-up — flip to base-down

        // Scale & centre computed AFTER rotation so bounding box is correct
        const box    = new THREE.Box3().setFromObject(root);
        const centre = box.getCenter(new THREE.Vector3());
        const size   = box.getSize(new THREE.Vector3());
        const s      = 2.5 / Math.max(size.x, size.y, size.z);
        root.scale.setScalar(s);
        root.position.copy(centre.multiplyScalar(-s));

        // ── Kinematic hierarchy (matches real bearing mechanics) ─────────────
        // root (flip/scale/centre)
        //   ├ E base, D support arm, bearings, Cube — STATIC
        //   └ leanGroup (pron/sup: ring rolls on side bearing, X @ ring centre)
        //       ├ A frame ring, B frame
        //       └ spinGroup (flexion: grip spins on its own bearings, local Y)
        //           └ Main_handle, piston
        scene.add(root);
        root.rotation.y = THREE.MathUtils.degToRad(MODEL_YAW);

        // Soft fake ground shadow — grounds the model, adds depth
        const shCanvas = document.createElement('canvas');
        shCanvas.width = shCanvas.height = 256;
        const ctx = shCanvas.getContext('2d');
        const grad = ctx.createRadialGradient(128, 128, 20, 128, 128, 128);
        grad.addColorStop(0, 'rgba(0,0,0,0.45)');
        grad.addColorStop(0.7, 'rgba(0,0,0,0.15)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, 256, 256);
        const shadow = new THREE.Mesh(
          new THREE.PlaneGeometry(3.4, 3.4),
          new THREE.MeshBasicMaterial({
            map: new THREE.CanvasTexture(shCanvas),
            transparent: true, depthWrite: false
          })
        );
        shadow.rotation.x = -Math.PI / 2;
        const bb = new THREE.Box3().setFromObject(root);
        shadow.position.y = bb.min.y - 0.01;
        scene.add(shadow);

        leanGroup = new THREE.Group();
        leanGroup.position.set(0, RING_CENTRE_Y, 0);   // pivot at ring centre
        root.add(leanGroup);
        spinGroup = new THREE.Group();                 // grip axis passes through
        leanGroup.add(spinGroup);                      // the ring centre too

        // Parts live under FBX_Root > 'assemb v8' — classify at that level.
        let assemb = null;
        root.traverse(function(n) {
          if (!assemb && (n.name || '').toLowerCase().replace(/_/g, ' ').includes('assemb')) assemb = n;
        });
        const parts = (assemb ? assemb.children : root.children).slice();

        const toLean = [], toSpin = [];
        parts.forEach(function(node) {
          // GLTFLoader sanitizes names: spaces become underscores — undo that
          const name = (node.name || '').toLowerCase().replace(/_/g, ' ');
          if (name.includes('a frame') || name.includes('b frame'))
            toLean.push(node);                                   // ring assembly
          else if (name.includes('handle') || name.includes('piston'))
            toSpin.push(node);                                   // grip
          // e base, d support, bearings, cube → static, stay put
        });
        toLean.forEach(function(n) { leanGroup.attach(n); });
        toSpin.forEach(function(n) { spinGroup.attach(n); });
        console.log('lean:', toLean.map(n => n.name),
                    '| spin:', toSpin.map(n => n.name));
      },
      undefined,
      function(e) { console.error('GLB load error:', e); }
    );

    // ── Demo mode: model demonstrates a movement (used by warmup/assessment) ──
    let _demoAxis = null, _demoSign = 1, _demoStart = 0, _demoUntil = 0;
    window.demoMove = function(axis, sign, secs) {   // axis: 'flex' | 'pron'
      _demoAxis  = axis;
      _demoSign  = sign;
      _demoStart = performance.now();
      _demoUntil = _demoStart + (secs || 2.6) * 1000;
    };
    function demoActive() { return performance.now() < _demoUntil; }

    // ── Public API ────────────────────────────────────────────────────────────
    // True anatomical angles in degrees, straight from the firmware ranges.
    window.setPose = function(flexDeg, pronSupDeg) {
      if (demoActive()) return;   // live feed paused while demonstrating
      _flex    = THREE.MathUtils.degToRad(flexDeg)    * FLEX_VIS_SIGN;
      _pronSup = THREE.MathUtils.degToRad(pronSupDeg) * PRONSUP_VIS_SIGN;
      const s = function(v) { return v >= 0 ? '+' : ''; };
      document.getElementById('readout').innerHTML =
        'Flex/Ext ' + s(flexDeg) + flexDeg.toFixed(1)  + '°&nbsp;&nbsp;' +
        'Pron/Sup ' + s(pronSupDeg) + pronSupDeg.toFixed(1) + '°';
    };

    // Manual test without the controller: open this file in a browser and use
    // arrow keys. Left/Right = pron/sup, Up/Down = flex/ext, R = reset.
    let _tFlex = 0, _tPron = 0;
    window.addEventListener('keydown', function(ev) {
      if (ev.key === 'ArrowLeft')  _tPron -= 5;
      else if (ev.key === 'ArrowRight') _tPron += 5;
      else if (ev.key === 'ArrowUp')    _tFlex += 5;
      else if (ev.key === 'ArrowDown')  _tFlex -= 5;
      else if (ev.key === 'r' || ev.key === 'R') { _tFlex = 0; _tPron = 0; }
      else return;
      window.setPose(_tFlex, _tPron);
    });
    // Back-compat alias (old caller signature: roll, pitch)
    window.setRotation = function(rollDeg, pitchDeg) {
      window.setPose(pitchDeg, rollDeg);
    };

    // ── Render loop ───────────────────────────────────────────────────────────
    (function animate() {
      requestAnimationFrame(animate);
      if (demoActive()) {
        // Smooth push-and-return pulses in the demonstrated direction
        const t = (performance.now() - _demoStart) / 1000;
        const pulse = Math.max(0, Math.sin(t * 2.4));         // 0→1→0 loops
        const a = THREE.MathUtils.degToRad(35) * pulse * _demoSign;
        if (_demoAxis === 'flex') { _flex = a * FLEX_VIS_SIGN;    _pronSup = 0; }
        else                      { _pronSup = a * PRONSUP_VIS_SIGN; _flex = 0; }
      }
      if (spinGroup) spinGroup.rotation.y = _flex;     // flexion = vertical spin
      if (leanGroup) leanGroup.rotation.x = _pronSup;  // pron/sup = sideways lean
      renderer.render(scene, camera);
    })();

    // ── Resize ────────────────────────────────────────────────────────────────
    window.addEventListener('resize', function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
